[package]
authors = ["Tamo <tamo@meilisearch.com", "Dean Karn <dean@segment.com>", "Ulysse Carion <ulysse@segment.com>"]
description = "Segment analytics client for Rust. Forked for Meilisearch: https://github.com/meilisearch"
edition = "2024"
license = "MIT"
repository = "https://github.com/irevoire/segment"
keywords = ["meilisearch", "analytics", "segment"]
name = "segment"
version = "0.3.1"
readme = "README.md"
rust-version = "1.85"

[workspace]
members = ["segment-public-api"]
resolver = "3"

[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
reqwest = { version = "0.13.4", features = ["json"], default-features = false }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.28.1", features = ["macros", "rt", "sync", "time"], default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.28.1", features = ["rt", "macros"], default-features = false }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]

[package]
authors = [
    "Martijn Berger <mbr@veo.co>",
    "Tamo <tamo@meilisearch.com>",
    "Dean Karn <dean@segment.com>",
    "Ulysse Carion <ulysse@segment.com>",
]
description = "Segment analytics client for Rust"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["segment", "analytics", "telemetry", "tracking"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
name = "veo-segment"
version = "0.4.0"
readme = "README.md"
documentation = "https://docs.rs/veo-segment"
rust-version.workspace = true
exclude = [".github/", ".gitignore", "scripts/"]

[lib]
name = "segment"

[workspace]
members = ["segment-public-api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/veo-technologies/segment"

[workspace.dependencies]
bytes = "1.11.1"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
futures-core = "0.3.32"
httpdate = "1.0.3"
jiff = { version = "0.2.43", default-features = false, features = ["serde", "std"] }
openapiv3 = "2.2.0"
percent-encoding = "2.3.2"
prettyplease = "0.3.0"
progenitor = { version = "0.16.0", default-features = false }
progenitor-client = "0.16.0"
regress = "0.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
syn = "3.0.2"
thiserror = "2.0.18"
tokio = { version = "1.40.0", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.11.0", features = ["v4"] }

[dependencies]
flate2 = { workspace = true, optional = true }
httpdate.workspace = true
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
flate2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[features]
default = ["rustls-tls", "gzip"]
gzip = ["dep:flate2"]
tracing = ["dep:tracing"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]

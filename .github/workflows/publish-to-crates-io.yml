on:
  release:
    types: [published]

name: Publish new version to crates.io

jobs:
  publish-crates-io:
    name: Publish on crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish veo-segment
        run: cargo publish -p veo-segment --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      - name: Publish veo-segment-public-api
        run: cargo publish -p veo-segment-public-api --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

[package]
name = "veo-segment-public-api"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated Rust client for the Segment Public API"
keywords = ["segment", "analytics", "openapi", "management"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
readme = "README.md"
documentation = "https://docs.rs/veo-segment-public-api"

[lib]
name = "segment_public_api"

[dependencies]
bytes.workspace = true
futures-core.workspace = true
percent-encoding.workspace = true
progenitor-client.workspace = true
reqwest = { workspace = true, features = ["query", "stream"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true

[build-dependencies]
openapiv3.workspace = true
prettyplease.workspace = true
progenitor.workspace = true
regress.workspace = true
serde_json.workspace = true
syn.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
